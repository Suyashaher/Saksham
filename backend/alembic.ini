# A generic, single database configuration.

[alembic]
# path to migration scripts — relative to this file
script_location = alembic

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path prepended so that the app package is importable
prepend_sys_path = .

# sqlalchemy.url is overridden in env.py from Settings; this is a fallback
sqlalchemy.url = postgresql+psycopg2://fdr_user:fdr_pass@postgres:5432/fdr_portal

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
