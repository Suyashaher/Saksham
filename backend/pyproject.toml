[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdr-portal-backend"
version = "0.1.0"
description = "AICTE Security Deposit / FDR Management Portal - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29.0,<1.0",
    "psycopg2-binary>=2.9.9,<3.0",
    "alembic>=1.13.0,<2.0",
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "greenlet>=3.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt>=4.0.0,<5.0",
    "slowapi>=0.1.9,<1.0",
    "email-validator>=2.1.0",
    "cryptography>=43.0.0",
    "minio>=7.2.0",
    "python-multipart>=0.0.9",
    "celery>=5.3.0",
    "jinja2>=3.1.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    "redis>=5.0.0",
    # AI/ML — Phase 7B
    "pytesseract>=0.3.13",
    "PyMuPDF>=1.25.1",
    "Pillow>=11.1.0",
    "scikit-learn>=1.6.1",
    "google-genai>=1.14.0",
    "pandas>=2.2.3",
    "numpy>=2.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 99
